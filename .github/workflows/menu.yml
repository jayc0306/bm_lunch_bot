name: kamco-menu

on:
  schedule:
    - cron: "30,45 1 * * 1-5"   # 평일 KST 10:30, 10:45 (메뉴 전송, 두 번째는 예비)
    - cron: "0 * * * *"         # 매시 정각 (네이버 소식 확인 + 봇에 보낸 사진 수신)
  workflow_dispatch:            # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: kamco-menu
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: 상태 저장
        if: always()
        run: |
          git config user.name "kamco-menu-bot"
          git config user.email "kamco-menu-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "menu state update" && git push)
